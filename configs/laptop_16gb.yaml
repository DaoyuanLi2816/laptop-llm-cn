# 16GB NVIDIA 笔记本/桌面 GPU 档：16k 词表时约 42M 参数。
# 这里仍指向 demo 数据，只为让路径开箱可用；想获得能力，必须按 docs/data.md 换真实语料。
name: laptop-16gb
seed: 42
output_dir: artifacts/laptop-16gb
tokenizer_path: artifacts/laptop-16gb/tokenizer.json
tokenizer_vocab_size: 16000
tokenizer_min_frequency: 2
tokenizer_corpus:
  - data/demo/pretrain_train.txt
  - data/demo/pretrain_eval.txt

data:
  pretrain_train: data/demo/pretrain_train.txt
  pretrain_eval: data/demo/pretrain_eval.txt
  sft_train: data/demo/sft_train.jsonl
  sft_eval: data/demo/sft_eval.jsonl
  dpo_train: data/demo/dpo_train.jsonl
  dpo_eval: data/demo/dpo_eval.jsonl

model:
  dim: 512
  n_layers: 12
  n_heads: 8
  n_kv_heads: 2
  max_seq_len: 1024
  dropout: 0.0

stages:
  pretrain:
    batch_size: 4
    gradient_accumulation_steps: 8
    max_steps: 20000
    learning_rate: 0.0004
    min_learning_rate: 0.00004
    warmup_steps: 500
    log_interval: 10
    eval_interval: 500
    eval_batches: 30
    save_interval: 2000
    dtype: bfloat16
    gradient_checkpointing: true
  sft:
    batch_size: 2
    gradient_accumulation_steps: 8
    max_steps: 2000
    learning_rate: 0.00005
    min_learning_rate: 0.000005
    warmup_steps: 100
    log_interval: 10
    eval_interval: 200
    eval_batches: 30
    save_interval: 500
    dtype: bfloat16
    gradient_checkpointing: true
  dpo:
    batch_size: 1
    gradient_accumulation_steps: 8
    max_steps: 600
    learning_rate: 0.00001
    min_learning_rate: 0.000001
    warmup_steps: 50
    log_interval: 5
    eval_interval: 100
    eval_batches: 20
    save_interval: 200
    dtype: bfloat16
    gradient_checkpointing: true
    dpo_beta: 0.1
