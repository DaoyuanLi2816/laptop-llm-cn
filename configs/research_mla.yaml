# MLA 与 GQA 是替代模块。本实现不组合 MLA + sliding / QK Norm。
name: research-mla
seed: 42
output_dir: artifacts/research-mla
tokenizer_path: artifacts/research-mla/tokenizer.json
tokenizer_vocab_size: 512
tokenizer_min_frequency: 1
tokenizer_corpus: [data/demo/pretrain_train.txt]
data:
  pretrain_train: data/demo/pretrain_train.txt
  pretrain_eval: data/demo/pretrain_eval.txt
  sft_train: data/demo/sft_train.jsonl
  sft_eval: data/demo/sft_eval.jsonl
  dpo_train: data/demo/dpo_train.jsonl
  dpo_eval: data/demo/dpo_eval.jsonl
model:
  dim: 64
  n_layers: 4
  n_heads: 4
  n_kv_heads: 2
  max_seq_len: 128
  attention_type: mla
  kv_lora_rank: 16
stages:
  pretrain: &stage
    batch_size: 2
    gradient_accumulation_steps: 1
    max_steps: 4
    learning_rate: 0.001
    min_learning_rate: 0.0001
    warmup_steps: 1
    log_interval: 1
    eval_interval: 4
    eval_batches: 2
    save_interval: 100
    dtype: float32
    gradient_checkpointing: true
  sft:
    <<: *stage
    learning_rate: 0.0005
  dpo:
    <<: *stage
    learning_rate: 0.0001
