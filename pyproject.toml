[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "laptop-llm-cn"
version = "0.1.0"
description = "一台笔记本即可跑通预训练、SFT、DPO、评测与 OpenAI 兼容 Serving 的中文 LLM 教学仓库"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Daoyuan Li" }]
keywords = ["llm", "pytorch", "transformer", "chinese", "education"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Education",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
]
dependencies = [
  "numpy>=1.24",
  "torch>=2.3",
  "tokenizers>=0.20",
  "PyYAML>=6.0",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
]

[project.optional-dependencies]
data = ["datasets>=3.0"]
dev = [
  "build>=1.2",
  "httpx>=0.27",
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "ruff>=0.8",
]

[project.scripts]
laptop-llm = "laptop_llm.cli:main"

[project.urls]
Homepage = "https://github.com/DaoyuanLi2816/laptop-llm-cn"
Repository = "https://github.com/DaoyuanLi2816/laptop-llm-cn"
Issues = "https://github.com/DaoyuanLi2816/laptop-llm-cn/issues"

[tool.hatch.build.targets.wheel]
packages = ["laptop_llm"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]
