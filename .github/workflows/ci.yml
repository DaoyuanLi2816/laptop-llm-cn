name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  PYTHONUTF8: "1"
  PYTHONIOENCODING: "utf-8"

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Lint
        run: ruff check .
      - name: Test
        run: pytest
      - name: Index routing with alternate CPU arithmetic
        if: runner.os == 'Windows'
        env:
          ATEN_CPU_CAPABILITY: default
          MKL_CBWR: COMPATIBLE
        run: python -m pytest tests/test_frontier_architecture.py
      - name: Advanced end-to-end curriculum
        run: python scripts/lab_smoke.py --output artifacts/ci-lab --device cpu
      - name: Build distribution
        run: python -m build

  smoke-pipeline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install -e .
      - run: laptop-llm pipeline --config configs/smoke.yaml --device cpu
      - run: laptop-llm pipeline --config configs/research_mla.yaml --device cpu
      - run: laptop-llm pipeline --config configs/research_moe.yaml --device cpu
      - name: Frontier architectures, post-training and inference
        run: python scripts/frontier_smoke.py --output artifacts/ci-frontier --device cpu
      - run: python scripts/ddp_lesson.py
      - run: python scripts/bandit_lesson.py
